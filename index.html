<style>
:root{--bg:#f4f5fa;--ink:#1d2433;--muted:#6b7385;--line:#e3e6ee;--sab:#fff0b8;--dom:#ffd3d3;--fest:#e0d0ff;--fest-ink:#5b2fb8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;padding-bottom:24px}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:21px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav.tabs{display:flex;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:#7c3aed}
main{padding:12px;max-width:640px;margin:0 auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:0 2px 12px;color:var(--muted)}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.08)}
.card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.list{padding:2px 12px}
.daybar{display:flex;gap:8px;align-items:center}
.daybar button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;flex:none;color:var(--ink)}
.daybar select{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);font-size:16px;padding:0 8px;background:#fff;color:var(--ink)}
.dayhead{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.dayhead.sab{background:var(--sab)}
.dayhead.dom{background:var(--dom)}
.dayhead.fest{background:var(--fest)}
.dtitle{font-weight:700;font-size:16px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#fff}
.badge.fest{color:var(--fest-ink)}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.pic{border:0;background:none;padding:0;cursor:pointer;flex:none;line-height:0}
.pic svg{border-radius:12px;display:block}
.tinfo{flex:1;min-width:0}
.tname{font-weight:700;font-size:15px}
.tdesc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.chip{color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;flex:none;white-space:nowrap}
.chip.libre{background:#c5cad6}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pbtn{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:12px;padding:10px 0;font-weight:700;font-size:13px;cursor:pointer}
.pbtn.on{background:var(--c);color:#fff}
.months{display:flex;gap:6px;margin-top:10px}
.mbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-size:13px;cursor:pointer;color:var(--ink)}
.mbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sumgrid{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;margin-top:4px}
.sumgrid span{background:#f1f3f8;padding:5px 10px;border-radius:999px}
.sumgrid b{font-weight:800}
.grp{margin-bottom:10px}
.gdate{font-weight:700;font-size:14px;padding:8px 10px;border-radius:10px;background:#f1f3f8;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:2px}
.gdate.sab{background:var(--sab)}
.gdate.dom{background:var(--dom)}
.gdate.fest{background:var(--fest)}
.ver{font-weight:400;font-size:12px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:10px;padding:4px 6px;font-size:14px;cursor:pointer}
.mini svg{border-radius:10px;display:block;flex:none}
.empty-msg{color:var(--muted);font-size:14px;padding:8px 0}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mhead h3{margin:0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid.head span{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cell{aspect-ratio:1;border:0;border-radius:10px;background:#f1f3f8;font-size:14px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;font-family:inherit}
.cell.sab{background:var(--sab)}
.cell.dom{background:var(--dom)}
.cell.fest{background:var(--fest);font-weight:700;color:var(--fest-ink)}
.cell i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px;color:var(--fest-ink)}
.cell.empty{background:none;cursor:default}
.note{font-size:12px;color:var(--muted);margin:4px 2px 0}
.lb{display:none;position:fixed;inset:0;background:rgba(15,20,35,.65);align-items:center;justify-content:center;padding:20px;z-index:10}
.lb.show{display:flex}
.lbcard{background:#fff;border-radius:18px;padding:18px;text-align:center;max-width:340px;width:100%}
.lbpic{width:220px;height:220px;max-width:75vw;max-height:55vh;border-radius:16px}
.lbcard .tname{font-size:18px;margin-top:10px}
.lbcard .tdesc{font-size:14px;margin-top:6px}
.lbcard small{display:block;margin-top:12px;color:var(--muted);font-size:12px}
#svgdefs{position:absolute;width:0;height:0;overflow:hidden}
</style>
</head>

  {label:'Barrer casa', icon:'barrer', desc:'Barrer los suelos de la casa.'},
  {label:'Ordenada baño arriba', icon:'bano-orden', desc:'Ordenar el baño de arriba: toallas y encimera.'},
  {label:'Sala', icon:'sala', desc:'Ordenar y limpiar la sala.'}
];
const PEOPLE = {GABY:'#e75480', DANNA:'#7b4fd1', MALEJA:'#0f9d8a', OSCAR:'#2f6fd6'};
const HOLIDAYS = ['2026-12-08','2026-12-25','2027-01-01'];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAC = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const KIND_NAME = {fest:'★ Festivo', sab:'Sábado', dom:'Domingo'};

const DAYS = DATA.map(x => {
  const [y,m,d] = x.d.split('-').map(Number);
  const wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return {key:x.d, y, m, d, wd, hol: HOLIDAYS.includes(x.d), a: x.a};
});

function kind(x){ return x.hol ? 'fest' : x.wd === 6 ? 'sab' : x.wd === 0 ? 'dom' : 'lab'; }

function startIdx(){
  const n = new Date();
  const k = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  const i = DAYS.findIndex(x => x.key === k);
  if (i >= 0) return i;
  return k < DAYS[0].key ? 0 : DAYS.length - 1;
}

const S = {tab:'dia', idx:startIdx(), person:'GABY', month:'all'};

function chip(v){
  return v === 'NO' ? '<span class="chip libre">Libre</span>'
                    : '<span class="chip" style="background:'+PEOPLE[v]+'">'+v+'</span>';
}
function pic(i, size){
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true"><use href="#ic-'+TASKS[i].icon+'" width="100" height="100"/></svg>';
}

function setTab(t){ S.tab = t; render(); window.scrollTo(0,0); }
function goDay(i){ S.idx = i; S.tab = 'dia'; render(); window.scrollTo(0,0); }
function step(n){ S.idx = Math.min(DAYS.length-1, Math.max(0, S.idx + n)); render(); }
function pick(v){ S.idx = +v; render(); }
function setPerson(p){ S.person = p; render(); }
function setMonth(m){ S.month = m; render(); }
function zoom(i){
  document.getElementById('lbuse').setAttribute('href', '#ic-'+TASKS[i].icon);
  document.getElementById('lbname').textContent = TASKS[i].label;
  document.getElementById('lbdesc').textContent = TASKS[i].desc;
  document.getElementById('lb').classList.add('show');
}

function viewDia(){
  const x = DAYS[S.idx], k = kind(x);
  const opts = DAYS.map((y,i) => '<option value="'+i+'"'+(i===S.idx?' selected':'')+'>'+DIAC[y.wd]+' '+y.d+' '+MES[y.m-1].slice(0,3)+(y.hol?' ★':'')+'</option>').join('');
  const rows = TASKS.map((t,i) =>
    '<div class="task">'+
      '<button class="pic" onclick="zoom('+i+')" aria-label="Ver imagen: '+t.label+'">'+pic(i,56)+'</button>'+
      '<div class="tinfo"><div class="tname">'+t.label+'</div><div class="tdesc">'+t.desc+'</div></div>'+
      chip(x.a[i]) +
    '</div>').join('');
  return '<div class="card"><div class="daybar">'+
      '<button onclick="step(-1)" aria-label="Día anterior">‹</button>'+
      '<select onchange="pick(this.value)" aria-label="Elegir día">'+opts+'</select>'+
      '<button onclick="step(1)" aria-label="Día siguiente">›</button>'+
    '</div></div>'+
    '<div class="dayhead '+k+'"><div class="dtitle">'+DIA[x.wd]+', '+x.d+' de '+MES[x.m-1]+' de '+x.y+'</div>'+
      (k==='lab' ? '' : '<span class="badge '+(k==='fest'?'fest':'')+'">'+KIND_NAME[k]+'</span>')+
    '</div>'+
    '<div class="card list">'+rows+'</div>';
}

function viewPersona(){
  const names = Object.keys(PEOPLE);
  const btns = names.map(n => '<button class="pbtn'+(n===S.person?' on':'')+'" style="--c:'+PEOPLE[n]+'" onclick="setPerson(\''+n+'\')">'+n+'</button>').join('');
  const meses = [['all','Todo'],['11','Nov'],['12','Dic'],['1','Ene']];
  const mb = meses.map(([v,l]) => '<button class="mbtn'+(String(S.month)===v?' on':'')+'" onclick="setMonth(\''+v+'\')">'+l+'</button>').join('');
  let total = 0; const counts = TASKS.map(() => 0); let groups = '';
  DAYS.forEach((x,i) => {
    if (S.month !== 'all' && String(x.m) !== S.month) return;
    const items = TASKS.map((t,j) => ({t,j})).filter(o => x.a[o.j] === S.person);
    if (!items.length) return;
    items.forEach(o => { counts[o.j]++; total++; });
    groups += '<div class="grp"><div class="gdate '+kind(x)+'" onclick="goDay('+i+')"><span>'+DIAC[x.wd]+' '+x.d+' '+MES[x.m-1].slice(0,3)+(x.hol?' ★':'')+'</span><span class="ver">ver día ›</span></div>'+
      items.map(o => '<div class="mini" onclick="zoom('+o.j+')">'+pic(o.j,40)+'<span>'+o.t.label+'</span></div>').join('')+
    '</div>';
  });
  const resumen = TASKS.map((t,j) => counts[j] ? '<span><b>'+counts[j]+'</b> '+t.label+'</span>' : '').join('');
  return '<div class="card"><div class="seg">'+btns+'</div><div class="months">'+mb+'</div></div>'+
    '<div class="card"><div class="mhead"><h3>'+S.person+'</h3><span class="ver">'+total+' tareas</span></div>'+
      (total ? '<div class="sumgrid">'+resumen+'</div>' : '<div class="empty-msg">Sin tareas asignadas en este periodo.</div>')+
    '</div>'+
    (total ? groups : '');
}

function viewCal(){
  const months = [[2026,11],[2026,12],[2027,1]];
  return months.map(([y,m]) => {
    const first = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;
    let cells = '';
    for (let b = 0; b < first; b++) cells += '<span class="cell empty"></span>';
    DAYS.forEach((x,i) => {
      if (x.y !== y || x.m !== m) return;
      cells += '<button class="cell '+kind(x)+'" onclick="goDay('+i+')" aria-label="'+x.d+' de '+MES[m-1]+'">'+x.d+(x.hol?'<i>★</i>':'')+'</button>';
    });
    return '<div class="card"><div class="mhead"><h3>'+MES[m-1].charAt(0).toUpperCase()+MES[m-1].slice(1)+' '+y+'</h3></div>'+
      '<div class="grid head">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => '<span>'+d+'</span>').join('')+'</div>'+
      '<div class="grid">'+cells+'</div></div>';
  }).join('');
}

function render(){
  ['dia','persona','cal'].forEach(t => document.getElementById('t-'+t).classList.toggle('on', S.tab === t));
  const v = document.getElementById('view');
  v.innerHTML = S.tab === 'dia' ? viewDia() : S.tab === 'persona' ? viewPersona() : viewCal();
}
render();
</script>
</body>
</html>
